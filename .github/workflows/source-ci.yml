name: Source CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source, tests, and licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Enforce the source-only repository contract
        run: |
          test "$(tr -d '\n' < VERSION)" = "$(sed -nE 's/^version = "([0-9.]+)"/\1/p' game/Cargo.toml)"
          bash scripts/check-source-only.sh

      - name: Hydrate the pinned PSoXide SDK
        run: cargo run --release --locked --manifest-path host/hl-build/Cargo.toml -- sdk

      - name: Verify the PSoXide pin is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(sed -nE 's/.*psoxide-link.*rev = "([0-9a-f]{40})".*/\1/p' host/hl-build/Cargo.toml)
          test ${#pin} -eq 40
          status=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/EBonura/PSoXide/compare/${pin}...main" \
            | jq -r .status)
          case "$status" in
            identical|ahead) ;;
            *) echo "PSoXide pin is not on main: $status" >&2; exit 1 ;;
          esac

      - name: Check formatting
        run: |
          cargo fmt --manifest-path host/hl-build/Cargo.toml --package hl-psx-build -- --check
          cargo fmt --manifest-path game/Cargo.toml --package hl-psx -- --check
          cargo fmt --manifest-path host/hl-bsp/Cargo.toml --package hl-bsp -- --check
          cargo fmt --manifest-path host/hl-content/Cargo.toml --package hl-content -- --check
          cargo fmt --manifest-path host/hl-logic-tests/Cargo.toml --package hl-logic-tests -- --check
          cargo fmt --manifest-path shared/hl-format/Cargo.toml --package hl-format -- --check

      - name: Deny warnings in the host crates
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          cargo check --manifest-path host/hl-build/Cargo.toml --all-targets --locked
          cargo check --manifest-path host/hl-bsp/Cargo.toml --all-targets --locked
          cargo check --manifest-path host/hl-content/Cargo.toml --all-targets --locked
          cargo check --manifest-path host/hl-logic-tests/Cargo.toml --all-targets --locked
          cargo check --manifest-path shared/hl-format/Cargo.toml --all-targets

      - name: Run host tests
        run: |
          cargo test --manifest-path host/hl-build/Cargo.toml --locked
          cargo test --manifest-path host/hl-bsp/Cargo.toml --locked
          cargo test --manifest-path host/hl-content/Cargo.toml --locked
          cargo test --manifest-path host/hl-logic-tests/Cargo.toml --locked
          cargo test --manifest-path shared/hl-format/Cargo.toml

      - name: Install cargo-deny
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-deny@0.19.4

      - name: Audit dependency advisories, licences, and sources
        run: |
          cargo deny --manifest-path host/hl-build/Cargo.toml check -A unmatched-source --config deny.toml advisories licenses sources
          cargo deny --manifest-path game/Cargo.toml check -A unmatched-source --config deny.toml advisories licenses sources
          cargo deny --manifest-path host/hl-bsp/Cargo.toml check -A unmatched-source --config deny.toml advisories licenses sources
          cargo deny --manifest-path host/hl-content/Cargo.toml check -A unmatched-source --config deny.toml advisories licenses sources
          cargo deny --manifest-path host/hl-logic-tests/Cargo.toml check -A unmatched-source --config deny.toml advisories licenses sources
          cargo deny --manifest-path shared/hl-format/Cargo.toml check -A unmatched-source --config deny.toml advisories licenses sources

  game-warnings:
    name: Game warnings under every feature set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Hydrate the pinned PSoXide SDK
        run: cargo run --release --locked --manifest-path host/hl-build/Cargo.toml -- sdk

      # game/build.rs reads data/skill.cfg and the voice manifest, which only
      # exist after a cook from a Half-Life install. Placeholders are enough
      # to type-check; nothing here is packed or run.
      - name: Stub the cooked data the game's build script reads
        run: bash scripts/stub-cooked-data.sh

      # Every feature set hl-build, the regression runner, PGO and the
      # diagnostic builds compile, since dead code and unused imports differ
      # per cfg. `--config` appends to game/.cargo/config.toml's target flags
      # (an exported RUSTFLAGS would replace them). The replay features embed
      # a route file at compile time; an empty one is enough to type-check.
      - name: Deny warnings in the game under every feature set
        working-directory: game
        run: |
          : > "$RUNNER_TEMP/empty-route"
          export HLPSX_SEMANTIC_INPUT="$RUNNER_TEMP/empty-route"
          export HLPSX_ROUTE_WAYPOINTS="$RUNNER_TEMP/empty-route"
          deny='target.mipsel-sony-psx.rustflags=["-Dwarnings"]'
          sets=(
            ""
            "--no-default-features"
            "--features main-ram-render-scratch,main-ram-projection-stack"
            "--features performance-telemetry,debug-map-boot,debug-regression-viewpoints,debug-weapon-gallery"
            "--features emulator-telemetry"
            "--features affine-heatmap"
            "--features seam-census"
            "--features warp-probe"
            "--features deep-reference-trace"
            "--features semantic-input"
            "--features route-follow"
          )
          for features in "${sets[@]}"; do
            echo "::group::cargo check ${features:-(default features)}"
            # shellcheck disable=SC2086 # the feature arguments are word-split on purpose
            cargo check --release --locked --config "$deny" $features
            echo "::endgroup::"
          done
