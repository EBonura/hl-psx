# Generated by tests/chain/hlroute.rs from parity-barnacle.route.
# Controller input only: no state is written, no map is forced.
name = "hl-parity-barnacle"
title = "Half-Life c1a2 barnacle: the tongue of the barnacle over the soda room corridor hooks the player, and one crowbar swing at the top of the haul kills it before the bite (its aim point was inside the ceiling, so no swing ever reached it)"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 60000

# Bound to the build this journey was written against.
[addr]
ENT_ACTIVE = 0x800d6db0
ENT_PHASE = 0x801eed44
LOGIC_PLAYER_HEALTH = 0x800ca944
LOGIC_PLAYER_PITCH = 0x801e87a8
LOGIC_PLAYER_POS = 0x801d3d38
LOGIC_PLAYER_VIEW_HEIGHT = 0x800cada0
LOGIC_PLAYER_YAW = 0x801d3d44
PROP_HEALTH = 0x800d9ee8
PROP_STATE = 0x800d7064
SIM_NOW = 0x801eae20
VM_LIVE_WM = 0x800c9424
WORLD_ARENA = 0x800e6ba8

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "open Options"
press = ["down"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "wrap to Debug"
press = ["up"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "select Segment select"
press = ["up"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "scroll to row 18"
press = ["down"]
hold = 8
wait = 12
repeat = 18

[[step]]
label = "launch the diagnostic segment"
press = ["cross"]
hold = 8
wait = 12

