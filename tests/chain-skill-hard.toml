# Generated by tests/chain/hlroute.rs from skill-hard.route.
# Controller input only: no state is written, no map is forced.
name = "hl-chain-skill-hard"
title = "Half-Life New Game on Hard: three changelevels of the tram ride keep Hard"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 20000

# Bound to the build this journey was written against.
[addr]
SIM_NOW = 0x801eafe0
SKILL = 0x800c3da0
WORLD_ARENA = 0x800da63c

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "title: choose Hard"
press = ["right"]
hold = 8
wait = 20

[[step]]
label = "title: New Game, Hard skill"
press = ["cross"]
hold = 12
wait = 24

# ---- c0a0 -> c0a0a ----
[[step]]
label = "c0a0 loads"
wait_until = { kind = "ram", sym = "WORLD_ARENA", offset = 4, size = 4, op = "eq", value = 6050 }
timeout = 9000

[[step]]
label = "c0a0 first simulation tick"
wait_until = { kind = "ram", sym = "SIM_NOW", size = 2, op = "lt", value = 64 }
timeout = 9000

[[step]]
checkpoint = "arrive-c0a0"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind="ram"
sym="SKILL"
size=1
op="eq"
value=2
# trailing wait of 900 ticks is replaced by the next block's load wait

