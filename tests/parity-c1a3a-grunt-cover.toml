# Controller input only: no state is written, no map is forced.
name = "hl-parity-c1a3a-grunt-cover"
title = "Half-Life c1a3a marine cover: the marine from the west catwalk comes down at the player, and a pistol hit while it is not charging or kicking sends it to a spot hidden from the player, where it holds"
disc = "build/ship/hl-psx.cue"
symbols = ["build/ship/hl-psx.map", "build/ship/symbols.txt"]
pad = "dualshock"
card_observe = true
max_ticks = 40000

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "open Options"
