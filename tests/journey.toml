# Shipping HL route: menu to Hazard Course gameplay, then chapter select to
# Interloper gameplay. Brush-solidity identity coverage is audited separately.
name = "hl"
title = "Half-Life: Hazard Course and Interloper"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 5900

[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
checkpoint = "main-menu"
# The title film advances on presentation frames; compare the stable menu UI.
mask = [{ x = 0, y = 0, w = 320, h = 85 }]

[[step]]
checkpoint = "main-menu-full-render"
golden = false
# Capture again without advancing time or masking the CPU/HW renderer matrix.
[[step.assert]]
kind = "not_flat"

[[step]]
label = "open Hazard Course map select"
press = ["down"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
checkpoint = "hazard-maps"
mask = [{ x = 0, y = 0, w = 320, h = 85 }]

[[step]]
checkpoint = "hazard-maps-full-render"
golden = false
[[step.assert]]
kind = "not_flat"

[[step]]
label = "enter the first Hazard Course map"
press = ["cross"]
hold = 8
wait = 1180

[[step]]
checkpoint = "hazard-spawn"
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "presenting"
window = 120
min_changes = 5
[[step.assert]]
kind = "pc_not_stuck"
window = 120

[[step]]
label = "walk into the authored training route"
lstick = [128, 0]
hold = 160
wait = 20

[[step]]
checkpoint = "hazard-walk"
# The ammo digits pulse with the frame phase; mask the HUD strip.
mask = [{ x = 96, y = 208, w = 128, h = 32 }]
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "frame_diff"
from = "hazard-spawn"
min_changed = 0.05

[[step]]
label = "pause and open chapter select"
press = ["start"]
hold = 8
wait = 25

[[step]]
checkpoint = "pause-menu"
# The held weapon at the bottom of the frozen frame is shaded by the animation phase the pause
# arrives in, which moves with every change of load time; the strip it occupies is left out of the comparison.
mask = [{ x = 0, y = 216, w = 320, h = 24 }]
[[step.assert]]
kind = "not_flat"

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 3

[[step]]
press = ["cross"]
hold = 8
wait = 20

[[step]]
label = "select Interloper, three rows above the first chapter"
press = ["up"]
hold = 8
wait = 12
repeat = 3

[[step]]
press = ["cross"]
hold = 8
wait = 15

[[step]]
press = ["cross"]
hold = 8
wait = 1180

[[step]]
checkpoint = "interloper-entry"
# Moving props and the interpolated view make this frame cadence-sensitive.
# Verify the settled entry pose and keep the full renderer matrix unmasked.
golden = false
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
signed = true
op = "eq"
value = -174
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 4
signed = true
op = "eq"
value = 276
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 8
signed = true
op = "eq"
value = -802
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
signed = true
op = "eq"
value = -174
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
offset = 4
signed = true
op = "eq"
value = 276
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
offset = 8
signed = true
op = "eq"
value = -802
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
offset = 16
size = 2
op = "eq"
value = 0
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "presenting"
window = 120
min_changes = 5
[[step.assert]]
kind = "pc_not_stuck"
window = 120

[[step]]
label = "walk through the Interloper entry terrain"
lstick = [128, 0]
hold = 150
wait = 20

[[step]]
checkpoint = "interloper-walk"
# The same traversal can end on adjacent simulation and display frames.
# Bound the reached terrain and camera pose while checking the full image matrix.
golden = false
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
signed = true
op = "eq"
value = -166
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 4
signed = true
op = "between"
value = 45
value_hi = 75
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 8
signed = true
op = "between"
value = -115
value_hi = -35
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
signed = true
op = "eq"
value = -166
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
offset = 4
signed = true
op = "between"
value = 45
value_hi = 75
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
offset = 8
signed = true
op = "between"
value = -115
value_hi = -35
[[step.assert]]
kind = "ram"
sym = "CAM_PREV"
signed = true
op = "eq"
value = -166
[[step.assert]]
kind = "ram"
sym = "CAM_PREV"
offset = 4
signed = true
op = "between"
value = 45
value_hi = 75
[[step.assert]]
kind = "ram"
sym = "CAM_PREV"
offset = 8
signed = true
op = "between"
value = -115
value_hi = -35
[[step.assert]]
kind = "ram"
sym = "CAM_CUR"
offset = 16
size = 2
op = "eq"
value = 0
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "frame_diff"
from = "interloper-entry"
min_changed = 0.05
