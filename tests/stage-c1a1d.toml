# Generated by tests/chain/hlroute.rs from stage-c1a1d.route.
# Controller input only: no state is written, no map is forced.
name = "hl-stage-c1a1d"
title = "Half-Life c1a1d stage: from the segment start, the ladders, the hop across the hanging crates, the doors and the ladder to the exit changelevel back to c1a1c"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 40000

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_HEALTH = 0x800ca944
LOGIC_PLAYER_PITCH = 0x801e87a8
LOGIC_PLAYER_POS = 0x801d3d38
LOGIC_PLAYER_YAW = 0x801d3d44
PLAYER_ON_GROUND = 0x801d3d50
SIM_NOW = 0x801eae20
WORLD_ARENA = 0x800e6ba8

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "open Options"
press = ["down"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "wrap to Debug"
press = ["up"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "select Segment select"
press = ["up"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "scroll to row 17"
press = ["down"]
hold = 8
wait = 12
repeat = 17

[[step]]
label = "launch the diagnostic segment"
press = ["cross"]
hold = 8
wait = 12

