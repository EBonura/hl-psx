[[step]]
label = "the lit frame reaches the screen a few frames after the switch"
wait = 100

[[step]]
checkpoint = "lit-2"
golden = false
[[step.assert]]
kind = "frame_diff"
from = "lit-1"
region = { x = 135, y = 45, w = 44, h = 38 }
