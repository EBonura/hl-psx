# Crowbar: chapter select at Lambda Core, R1 twelve times round to the crowbar (weapon 0, no ammo).
# A swing moves the hands (a frame change under the viewmodel) and plays the swing sound.
name = "hl-weapons-crowbar"
title = "Half-Life: the crowbar swings, with its sound, and never uses ammo"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800cdb8c
PREV_CLIP = 0x800cdb94
PREV_RESERVE = 0x800cdb90
PREV_HEALTH = 0x800cdb88
LAST_CORE = 0x800ce658
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "R1 steps to the next owned weapon"
press = ["r1"]
hold = 8
wait = 100
repeat = 12

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "crowbar up"
checkpoint = "crowbar-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 0
[[step.assert]]
kind = "not_flat"
[[step]]
label = "swing"
press = ["r2"]
hold = 4
wait = 3

[[step]]
label = "mid swing"
checkpoint = "crowbar-swing"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "frame_diff"
from = "crowbar-ready"
region = { x = 120, y = 100, w = 200, h = 140 }
min_changed = 0.02
[[step.assert]]
kind = "audio"
window = 60
min_peak = 300
[[step]]
label = "the swing ends"
wait = 30

[[step]]
label = "swing over"
checkpoint = "crowbar-after"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 0
[[step.assert]]
kind = "not_flat"
