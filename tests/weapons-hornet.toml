# Hive hand: R1 seven times (weapon 9, 8 hornets). Primary fires seeking hornets (glowing yellow); the hand recharges by itself.
name = "hl-weapons-hornet"
title = "Half-Life: the hive hand fires hornets that glow and recharge"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800ce22c
PREV_CLIP = 0x800ce234
PREV_RESERVE = 0x800ce230
PREV_HEALTH = 0x800ce228
LAST_CORE = 0x800cecf8
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "R1 steps to the next owned weapon"
press = ["r1"]
hold = 8
wait = 100
repeat = 7

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "hive hand up"
checkpoint = "hornet-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 9
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 8
[[step.assert]]
kind = "not_flat"
[[step]]
label = "fire hornets"
press = ["r2"]
hold = 20
wait = 0

[[step]]
label = "the sound asked for is core id 82"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 82 }
timeout = 300

[[step]]
label = "hornets away"
checkpoint = "hornet-fired"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "lt"
value = 8
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "pixels"
color = [255, 170, 40]
color_tol = 70
region = { x = 60, y = 60, w = 200, h = 140 }
min_count = 2
[[step]]
label = "recharge"
wait = 200

[[step]]
label = "hornets come back"
checkpoint = "hornet-recharged"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "ge"
value = 5
[[step.assert]]
kind = "not_flat"
