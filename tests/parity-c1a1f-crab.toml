# Generated by tests/chain/hlroute.rs from c1a1f-crab.route.
# Controller input only: no state is written, no map is forced.
name = "hl-parity-crab"
title = "Half-Life c1a1f: the headcrab at (-436,80) that wakes as the player leaves the vent crawl walks at the reference speed (5.02 units per 0.1 s: about 150 units in 60 ticks, the port had 3.0 per move)"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 80000

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_HEALTH = 0x800ca944
LOGIC_PLAYER_POS = 0x801d3d38
LOGIC_PLAYER_YAW = 0x801d3d44
PROP_HEALTH = 0x800d9ee8
PROP_POS = 0x801eaf3c
SIM_NOW = 0x801eae20
WORLD_ARENA = 0x800e6ba8

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "open Options"
press = ["down"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "wrap to Debug"
press = ["up"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "select Segment select"
press = ["up"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "scroll to row 14"
press = ["down"]
hold = 8
wait = 12
repeat = 14

[[step]]
label = "launch the diagnostic segment"
press = ["cross"]
hold = 8
wait = 12

