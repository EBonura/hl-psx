# MP5: R1 twice (weapon 3, 50 in the clip, 150 in reserve, M203 grenades loaded for testing).
# Holding the trigger fires a burst; the launcher on L2 lobs a grenade that goes off on the wall and hurts at this range.
name = "hl-weapons-mp5"
title = "Half-Life: the MP5 fires bursts and its grenade launcher blows up on the wall"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800ce22c
PREV_CLIP = 0x800ce234
PREV_RESERVE = 0x800ce230
PREV_HEALTH = 0x800ce228
LAST_CORE = 0x800cecf8
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "R1 steps to the next owned weapon"
press = ["r1"]
hold = 8
wait = 100
repeat = 2

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "MP5 up"
checkpoint = "mp5-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 3
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "eq"
value = 50
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 150
[[step.assert]]
kind = "not_flat"
[[step]]
label = "burst"
press = ["r2"]
hold = 30
wait = 4

[[step]]
label = "the sound asked for is core id 1"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 1 }
timeout = 300

[[step]]
label = "burst"
checkpoint = "mp5-burst"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "lt"
value = 48
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "audio"
window = 60
min_peak = 500
[[step]]
label = "settle"
wait = 30

[[step]]
label = "grenade launcher"
press = ["l2"]
hold = 4
wait = 0

[[step]]
label = "the sound asked for is core id 50"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 50 }
timeout = 300

[[step]]
label = "wait until PREV_HEALTH lt 100"
wait_until = { kind = "ram", sym = "PREV_HEALTH", size = 2, op = "lt", value = 100 }
timeout = 400

[[step]]
label = "blast"
checkpoint = "mp5-m203-blast"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_HEALTH"
size = 2
op = "lt"
value = 100
[[step.assert]]
kind = "not_flat"
