# Snark: R1 eleven times (weapon 11, 15 snarks). R2 tosses one with room ahead; with no enemy about it turns on the player.
name = "hl-weapons-snark"
title = "Half-Life: a squeak grenade is tossed and hunts, biting what it reaches"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800ce22c
PREV_CLIP = 0x800ce234
PREV_RESERVE = 0x800ce230
PREV_HEALTH = 0x800ce228
LAST_CORE = 0x800cecf8
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "R1 steps to the next owned weapon"
press = ["r1"]
hold = 8
wait = 100
repeat = 11

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "look down at the floor ahead"
rstick = [128, 255]
press = []
hold = 3
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "snark in hand"
checkpoint = "snark-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 11
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 15
[[step.assert]]
kind = "not_flat"
[[step]]
label = "toss"
press = ["r2"]
hold = 8
wait = 0

[[step]]
label = "wait until PREV_RESERVE eq 14"
wait_until = { kind = "ram", sym = "PREV_RESERVE", size = 2, op = "eq", value = 14 }
timeout = 300

[[step]]
label = "in the air"
wait = 6

[[step]]
label = "the snark in flight"
checkpoint = "snark-air"
golden = false
[[step.assert]]
kind = "not_flat"
[[step]]
label = "on the floor"
wait = 25

[[step]]
label = "the snark running on the floor"
checkpoint = "snark-floor"
golden = false
[[step.assert]]
kind = "not_flat"
[[step]]
label = "wait until PREV_HEALTH lt 100"
wait_until = { kind = "ram", sym = "PREV_HEALTH", size = 2, op = "lt", value = 100 }
timeout = 1200

[[step]]
label = "bitten"
checkpoint = "snark-bit"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_HEALTH"
size = 2
op = "lt"
value = 100
[[step.assert]]
kind = "not_flat"
