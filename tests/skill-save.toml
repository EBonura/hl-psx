# The difficulty is part of a save: choose Hard on the New game row, start the
# Hazard Course, save to Card 1, reboot on the persisted card (the title opens
# on Medium again), load, and the game is on Hard. Run with psoxide-gate and a
# fresh report directory.
name = "hl-skill-save"
title = "Half-Life: Hard survives a save and a cold load"
disc = "build/ship/hl-psx.cue"
symbols = ["build/ship/hl-psx.map", "build/ship/symbols.txt"]
pad = "dualshock"
max_ticks = 9000

[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title, which opens on Medium; choose Hard"
wait = 620

[[step]]
press = ["right"]
hold = 8
wait = 20

[[step]]
checkpoint = "title-hard"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "SKILL"
size = 1
op = "eq"
value = 2

[[step]]
label = "Hazard Course map select, first map"
press = ["down"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["cross"]
hold = 8
wait = 1180

[[step]]
checkpoint = "hazard-hard"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "SKILL"
size = 1
op = "eq"
value = 2

[[step]]
label = "pause: the game reads Start at its next pad poll"
press = ["start"]
sync = "poll"
hold = 2

[[step]]
label = "the pause menu is open when Down moves its cursor to Save Game (PAUSE_STATE.sel 1)"
press = ["down"]
sync = "poll"
hold_until = { kind = "ram", sym = "PAUSE_STATE", size = 4, op = "eq", value = 1 }
timeout = 900

[[step]]
label = "open Save Game: the card slot page (PAUSE_STATE.page 0 is the slot page for saving)"
press = ["cross"]
sync = "poll"
hold_until = { kind = "ram", sym = "PAUSE_STATE", offset = 24, size = 1, op = "eq", value = 0 }
timeout = 900

[[step]]
label = "let go of Cross so the next press is a new one"
sync = "poll"
wait = 2

[[step]]
label = "save to Card 1 Manual: the write blocks the game, so the polls counted after it start once it is done"
press = ["cross"]
sync = "poll"
hold = 2
wait = 120

[[step]]
checkpoint = "game-saved"
golden = false
[[step.assert]]
kind = "card_writes"
min_count = 5
[[step.assert]]
kind = "ram"
sym = "SKILL"
size = 1
op = "eq"
value = 2

[[step]]
card = { action = "snapshot" }

[[step]]
card = { action = "reboot" }

[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "fresh title menu: the session forgot Hard, the save has not"
wait = 620

[[step]]
checkpoint = "title-rebooted"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "ram"
sym = "SKILL"
size = 1
op = "eq"
value = 1

[[step]]
label = "choose Load game"
press = ["down"]
hold = 8
wait = 12
repeat = 3

[[step]]
press = ["cross"]
hold = 8
wait = 1180

[[step]]
checkpoint = "world-reloaded-hard"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "presenting"
window = 120
min_changes = 5
[[step.assert]]
kind = "ram"
sym = "SKILL"
size = 1
op = "eq"
value = 2

[[step]]
card = { action = "snapshot" }
