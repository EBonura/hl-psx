# Generated by tests/chain/hlroute.rs from c1a1b-grate-rise.route.
# Controller input only: no state is written, no map is forced.
name = "hl-parity-c1a1b-grate-rise"
title = "Half-Life c1a1b: a swimmer rising at full speed under the exit grate (floor_grate2, a 4 unit func_train with dmg 500) is stopped by it while it lifts and slides away, and rises out unhurt, as in the reference (ref/rise.out: held about 30 ticks under it with health intact); the port let the lip step walk him through it and the blocked-train damage killed him"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 80000

