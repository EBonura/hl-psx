# Tau Cannon: R1 six times (weapon 7, no magazine, 15 cells). The primary shot costs two cells and draws an amber beam to the wall;
# holding L2 charges and spends more cells, and the release fires the heavier shot.
name = "hl-weapons-gauss"
title = "Half-Life: the Tau Cannon fires a beam, and a held secondary charges a bigger one"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800c9258
PREV_CLIP = 0x800c9260
PREV_RESERVE = 0x800c925c
PREV_HEALTH = 0x800c9254
LAST_CORE = 0x800c9d24
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "R1 steps to the next owned weapon"
press = ["r1"]
hold = 8
wait = 100
repeat = 6

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "Tau Cannon up"
checkpoint = "gauss-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 7
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 15
[[step.assert]]
kind = "not_flat"
[[step]]
label = "primary"
press = ["r2"]
hold = 8
wait = 0

[[step]]
label = "wait until PREV_RESERVE eq 13"
wait_until = { kind = "ram", sym = "PREV_RESERVE", size = 2, op = "eq", value = 13 }
timeout = 300

[[step]]
label = "the sound asked for is core id 5"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 5 }
timeout = 300

[[step]]
label = "beam"
checkpoint = "gauss-primary"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 13
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "pixels"
color = [255, 170, 60]
color_tol = 70
region = { x = 60, y = 60, w = 200, h = 140 }
min_count = 10
[[step.assert]]
kind = "audio"
window = 60
min_peak = 500
[[step]]
label = "settle"
wait = 60

[[step]]
label = "charge and release"
press = ["l2"]
hold = 90
wait = 0

[[step]]
label = "wait until PREV_RESERVE lt 12"
wait_until = { kind = "ram", sym = "PREV_RESERVE", size = 2, op = "lt", value = 12 }
timeout = 300

[[step]]
label = "charged shot"
checkpoint = "gauss-charged"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "lt"
value = 12
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "audio"
window = 90
min_peak = 500
