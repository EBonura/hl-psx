# Generated by tests/chain/hlroute.rs from c1a1f-carry.route.
# Controller input only: no state is written, no map is forced.
name = "hl-parity-c1a1f-carry"
title = "Half-Life c1a1f to c1a1b: the crawl Barney and the sliding zombie die in their scripted sequences (SCRIPT_EVENT_DEAD) and cross the changelevel as corpses, as in the reference (edicts 344 and 345, health 0); the player arrives with his health and nothing attacks him for 100 ticks (the port carried them alive: the zombie clawed him three times for 20 each)"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 80000

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_CLIP_AMMO = 0x800cad90
LOGIC_PLAYER_HEALTH = 0x800ca944
LOGIC_PLAYER_PITCH = 0x801e87a8
LOGIC_PLAYER_POS = 0x801d3d38
LOGIC_PLAYER_YAW = 0x801d3d44
PLAYER_ON_GROUND = 0x801d3d50
PROP_HEALTH = 0x800d9ee8
PROP_KIND = 0x800da67f
SIM_NOW = 0x801eae20
WORLD_ARENA = 0x800e6ba8

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "open Options"
press = ["down"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "wrap to Debug"
press = ["up"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "select Segment select"
press = ["up"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "scroll to row 14"
press = ["down"]
hold = 8
wait = 12
repeat = 14

[[step]]
label = "launch the diagnostic segment"
press = ["cross"]
hold = 8
wait = 12

