# Generated by tests/chain/hlroute.rs from c1a2-gun-deploy.route.
# Controller input only: no state is written, no map is forced.
name = "hl-parity-c1a2-gun-deploy"
title = "Half-Life c1a2 security gun: the miniturret waits for its deploy clip after it first sees the player, then hits a standing player about once in five ticks until he is dead (retail oracle ref/tur1..tur5)"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 30000
[card_fixture]
path = "tests/cards/dev-c1a2-gunroom.mcd"
sha256 = "97afedf11a83de7ecd8f571e64e51257a63653da22b8615963343a3349e4b34b"

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_HEALTH = 0x800cb124
LOGIC_PLAYER_POS = 0x801d3ed8
LOGIC_PLAYER_YAW = 0x801d3ee4
SIM_NOW = 0x801eaf28
WORLD_ARENA = 0x800e6e18

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "title: Load game"
press = ["down"]
hold = 8
wait = 12
repeat = 3

[[step]]
press = ["cross"]
hold = 8
wait = 60

# ---- c1a2 -> x ----
[[step]]
label = "c1a2 loads"
sync = "poll"
wait_until = { kind = "ram", sym = "WORLD_ARENA", offset = 4, size = 4, op = "eq", value = 10037 }
timeout = 9000

[[step]]
label = "c1a2 first simulation tick"
sync = "poll"
wait_until = { kind = "ram", sym = "SIM_NOW", size = 2, op = "lt", value = 64 }
timeout = 9000

[[step]]
sync = "poll"
wait_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[2]) != 0" }
timeout = 720

[[step]]
label = "c1a2 controller tape 0"
sync = "poll"
tape = "tests/parity/tapes-gun-deploy/c1a2-00.pxtape"
tape_rebase = true
timeout = 1440

[[step]]
