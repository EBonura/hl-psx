# Save at a moved Hazard Course position, reboot on the persisted card, and
# load that position through the title menu. Run with psoxide-gate and a fresh
# report directory. The ordinary visual journey remains tests/journey.toml.
name = "hl-save-repin"
title = "Half-Life: Hazard Course save and cold load"
disc = "build/ship/hl-psx.cue"
symbols = ["build/ship/hl-psx.map", "build/ship/symbols.txt"]
pad = "dualshock"
max_ticks = 7900

[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to title, then choose Hazard Course"
wait = 620

[[step]]
press = ["down"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["cross"]
hold = 8
wait = 1180

[[step]]
checkpoint = "hazard-spawn"
golden = false
[[step.assert]]
kind = "not_flat"

[[step]]
label = "walk to a position distinct from the spawn"
lstick = [128, 0]
hold = 160
wait = 20

[[step]]
checkpoint = "before-save"
golden = false
[[step.assert]]
kind = "frame_diff"
from = "hazard-spawn"
min_changed = 0.05
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
signed = true
op = "eq"
value = -1380
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 4
signed = true
op = "eq"
value = -28
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 8
signed = true
op = "eq"
value = -1555

[[step]]
label = "pause: the game reads Start at its next pad poll"
press = ["start"]
sync = "poll"
hold = 2

[[step]]
label = "the pause menu is open when Down moves its cursor to Save Game (PAUSE_STATE.sel 1)"
press = ["down"]
sync = "poll"
hold_until = { kind = "ram", sym = "PAUSE_STATE", size = 4, op = "eq", value = 1 }
timeout = 900

[[step]]
label = "open Save Game: the card slot page (PAUSE_STATE.page 0 is the slot page for saving)"
press = ["cross"]
sync = "poll"
hold_until = { kind = "ram", sym = "PAUSE_STATE", offset = 24, size = 1, op = "eq", value = 0 }
timeout = 900

[[step]]
checkpoint = "save-slots"
golden = false
[[step.assert]]
kind = "not_flat"

[[step]]
label = "let go of Cross so the next press is a new one"
sync = "poll"
wait = 2

[[step]]
label = "save to Card 1 Manual: the write blocks the game, so the polls counted after it start once it is done"
press = ["cross"]
sync = "poll"
hold = 2
wait = 120

[[step]]
checkpoint = "game-saved"
golden = false
[[step.assert]]
kind = "card_writes"
min_count = 5
[[step.assert]]
kind = "not_flat"

[[step]]
card = { action = "snapshot" }

[[step]]
card = { action = "reboot" }

[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "fresh title menu, choose Load game"
wait = 620

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 3

[[step]]
press = ["cross"]
hold = 8
wait = 1180

[[step]]
checkpoint = "world-reloaded"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "presenting"
window = 120
min_changes = 5
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
signed = true
op = "eq"
value = -1380
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 4
signed = true
op = "eq"
value = -28
[[step.assert]]
kind = "ram"
sym = "LOGIC_PLAYER_POS"
offset = 8
signed = true
op = "eq"
value = -1555

[[step]]
card = { action = "snapshot" }
