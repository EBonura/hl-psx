# Generated by tests/chain/hlroute.rs from c1a2-gun-crate.route.
# Controller input only: no state is written, no map is forced.
name = "hl-parity-c1a2-gun-crate"
title = "Half-Life c1a2: a crouched player drops from the duct mouth onto the pushable crate *28 and walks off it, and is on the floor, alive, before the security gun's first hit"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 30000
[card_fixture]
path = "tests/cards/c1a2-part2.mcd"
sha256 = "d74a1d065dd22d28b6aaef97fdcb2949c9bd557a8dc979bbd7e09f87b1dbca18"

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_HEALTH = 0x800cb124
LOGIC_PLAYER_POS = 0x801d3ed8
LOGIC_PLAYER_YAW = 0x801d3ee4
SIM_NOW = 0x801eaf28
WORLD_ARENA = 0x800e6e18

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "title: Load game"
press = ["down"]
hold = 8
wait = 12
repeat = 3

[[step]]
press = ["cross"]
hold = 8
wait = 60

# ---- c1a2 -> x ----
[[step]]
label = "c1a2 loads"
sync = "poll"
wait_until = { kind = "ram", sym = "WORLD_ARENA", offset = 4, size = 4, op = "eq", value = 10037 }
timeout = 9000

[[step]]
label = "c1a2 first simulation tick"
sync = "poll"
wait_until = { kind = "ram", sym = "SIM_NOW", size = 2, op = "lt", value = 64 }
timeout = 9000

[[step]]
sync = "poll"
wait_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[2]) != 0" }
timeout = 720

[[step]]
label = "c1a2 controller tape 0"
sync = "poll"
tape = "tests/parity/tapes-gun-crate/c1a2-00.pxtape"
tape_rebase = true
timeout = 1320

[[step]]
lstick = [128, 1]
rstick = [128, 128]
press = ["triangle"]
sync = "poll"
hold_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[0]) <= -120" }
timeout = 360

[[step]]
lstick = [128, 1]
rstick = [128, 128]
press = ["triangle"]
sync = "poll"
hold_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[0]) <= -170" }
timeout = 240

[[step]]
sync = "poll"
checkpoint = "on-crate"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=0
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=4
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=8
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_YAW"
size=2
op="between"
value=0
value_hi=65535
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
offset=4
size=4
signed=true
op="between"
value=-497
value_hi=-489
[[step.assert]]
kind="expr"
expr="i16(LOGIC_PLAYER_HEALTH) == 50"

[[step]]
lstick = [128, 1]
rstick = [128, 128]
press = ["triangle"]
sync = "poll"
hold_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[0]) <= -215" }
timeout = 240

[[step]]
lstick = [128, 1]
rstick = [128, 128]
press = []
sync = "poll"
hold_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[0]) <= -250" }
timeout = 360

[[step]]
sync = "poll"
checkpoint = "off-crate"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=0
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=4
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=8
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_YAW"
size=2
op="between"
value=0
value_hi=65535
[[step.assert]]
kind="expr"
expr="i16(LOGIC_PLAYER_HEALTH) >= 40"
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
offset=4
size=4
signed=true
op="between"
value=-545
value_hi=-535
# trailing wait of 0 ticks is replaced by the next block's load wait
