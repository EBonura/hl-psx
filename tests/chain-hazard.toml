# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_POS = 0x801cb514
LOGIC_PLAYER_YAW = 0x801cb520
SIM_NOW = 0x801e25fc
WORLD_ARENA = 0x800de3b4

