# Generated by tests/chain/hlroute.rs from hazard.route.
# Controller input only: no state is written, no map is forced.
name = "hl-chain-hazard"
title = "Half-Life Hazard Course: title, Hazard Course row, t0a0 start corridor, doors td1 and td2, the observation hall, the catwalk, round the canal, the jump course and the duck course"
