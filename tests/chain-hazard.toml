# Generated by tests/chain/hlroute.rs from hazard.route.
# Controller input only: no state is written, no map is forced.
name = "hl-chain-hazard"
title = "Half-Life Hazard Course: title, Hazard Course row, t0a0 start corridor, doors td1 and td2, the observation hall, the catwalk, round the canal, the jump course and the duck course"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 30000

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_POS = 0x801d39c8
LOGIC_PLAYER_YAW = 0x801d39d4
SIM_NOW = 0x801eaa18
WORLD_ARENA = 0x800e6908

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "title: open Hazard Course map select"
press = ["down"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the selected Hazard Course map"
press = ["cross"]
hold = 8
wait = 12

