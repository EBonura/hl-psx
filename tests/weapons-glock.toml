# Glock: chapter select at Lambda Core arrives with it in hand (17 in the magazine, 150 in the 9mm reserve).
# Primary takes one round, and the secondary fires faster, taking several in a short burst.
name = "hl-weapons-glock"
title = "Half-Life: the 9mm pistol fires single and fast shots and spends a round each"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800c9218
PREV_CLIP = 0x800c9220
PREV_RESERVE = 0x800c921c
PREV_HEALTH = 0x800c9214
LAST_CORE = 0x800c9ce4
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "pistol up"
checkpoint = "glock-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 1
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "eq"
value = 17
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 150
[[step.assert]]
kind = "not_flat"
[[step]]
label = "primary shot"
press = ["r2"]
hold = 4
wait = 0

[[step]]
label = "wait until PREV_CLIP eq 16"
wait_until = { kind = "ram", sym = "PREV_CLIP", size = 2, op = "eq", value = 16 }
timeout = 300

[[step]]
label = "the sound asked for is core id 0"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 0 }
timeout = 300

[[step]]
label = "one shot"
checkpoint = "glock-primary"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "eq"
value = 16
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "audio"
window = 60
min_peak = 500
[[step]]
label = "let the pistol settle"
wait = 20

[[step]]
label = "secondary: rapid fire"
press = ["l2"]
hold = 30
wait = 6

[[step]]
label = "rapid fire"
checkpoint = "glock-secondary"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "lt"
value = 14
[[step.assert]]
kind = "not_flat"
