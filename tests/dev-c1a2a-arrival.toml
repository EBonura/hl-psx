# Generated by tests/chain/hlroute.rs from dev-c1a2a-arrival.route.
# Controller input only: no state is written, no map is forced.
name = "dev-c1a2-arrive"
title = "dev: fly from the c1a2 elevator to the exit, save at the c1a2a arrival"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 30000

# Bound to the build this journey was written against.
[addr]
LOGIC_PLAYER_HEALTH = 0x800cac34
LOGIC_PLAYER_POS = 0x801d39a8
LOGIC_PLAYER_YAW = 0x801d39b4
SIM_NOW = 0x801ea9f8
WORLD_ARENA = 0x800e68e8

[[step]]
label = "skip the studio splash and the startup movie, if the disc has them"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot to the title"
wait = 620

[[step]]
label = "open Options"
press = ["down"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "wrap to Debug"
press = ["up"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "debug: toggle Fly Mode"
press = ["cross"]
hold = 8
wait = 12

[[step]]
label = "select Segment select"
press = ["up"]
hold = 8
wait = 12
repeat = 2

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "scroll to row 18"
press = ["down"]
hold = 8
wait = 12
repeat = 18

[[step]]
label = "launch the diagnostic segment"
press = ["cross"]
hold = 8
wait = 12

# ---- c1a2 -> c1a2a ----
[[step]]
label = "c1a2 loads"
sync = "poll"
wait_until = { kind = "ram", sym = "WORLD_ARENA", offset = 4, size = 4, op = "eq", value = 10037 }
timeout = 9000

[[step]]
label = "c1a2 first simulation tick"
sync = "poll"
wait_until = { kind = "ram", sym = "SIM_NOW", size = 2, op = "lt", value = 64 }
timeout = 9000

[[step]]
sync = "poll"
wait_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[2]) != 0" }
timeout = 1200

[[step]]
label = "c1a2 controller tape 0"
sync = "poll"
tape = "tests/chain/tapes-dev-c1a2a/c1a2-00.pxtape"
tape_rebase = true
timeout = 1320

[[step]]
lstick = [128, 128]
rstick = [214, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="ge", value=3153 }
timeout = 3600

[[step]]
lstick = [128, 128]
rstick = [182, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="ge", value=3243 }
timeout = 3600

[[step]]
lstick = [128, 128]
rstick = [74, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="le", value=3302 }
timeout = 3600

[[step]]
lstick = [128, 128]
rstick = [182, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="ge", value=3243 }
timeout = 3600

[[step]]
lstick = [128, 1]
rstick = [128, 128]
press = []
sync = "poll"
hold_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[0]) <= -470" }
timeout = 3600

[[step]]
label = "c1a2 controller tape 1"
sync = "poll"
tape = "tests/chain/tapes-dev-c1a2a/c1a2-01.pxtape"
tape_rebase = true
timeout = 1280

[[step]]
lstick = [128, 128]
rstick = [214, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="ge", value=3890 }
timeout = 3600

[[step]]
lstick = [128, 128]
rstick = [182, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="ge", value=3980 }
timeout = 3600

[[step]]
lstick = [128, 128]
rstick = [74, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="le", value=4039 }
timeout = 3600

[[step]]
lstick = [128, 128]
rstick = [182, 128]
press = []
sync = "poll"
hold_until = { kind="ram", sym="LOGIC_PLAYER_YAW", size=2, op="ge", value=3980 }
timeout = 3600

[[step]]
