# ---- c1a2a -> x ----
[[step]]
label = "c1a2a loads"
sync = "poll"
wait_until = { kind = "ram", sym = "WORLD_ARENA", offset = 4, size = 4, op = "eq", value = 9721 }
timeout = 9000

[[step]]
label = "c1a2a first simulation tick"
sync = "poll"
wait_until = { kind = "ram", sym = "SIM_NOW", size = 2, op = "lt", value = 64 }
timeout = 9000

[[step]]
sync = "poll"
wait_until = { kind="expr", expr="i32(LOGIC_PLAYER_POS[2]) != 0" }
timeout = 1200

[[step]]
label = "c1a2a controller tape 0"
sync = "poll"
tape = "tests/chain/tapes-dev-c1a2a/c1a2a-00.pxtape"
tape_rebase = true
timeout = 1440

[[step]]
sync = "poll"
checkpoint = "arrival"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=0
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=4
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_POS"
size=4
signed=true
offset=8
op="between"
value=-100000
value_hi=100000
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_YAW"
size=2
op="between"
value=0
value_hi=65535
[[step.assert]]
kind="expr"
expr="i16(LOGIC_PLAYER_HEALTH) >= 90"

[[step]]
label = "pause and open Save Game"
press = ["start"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12

[[step]]
press = ["cross"]
hold = 8
wait = 35

[[step]]
label = "save to Card 1 Manual"
press = ["cross"]
hold = 8
wait = 400

[[step]]
checkpoint = "game-saved"
golden = false
[[step.assert]]
kind = "card_writes"
min_count = 5

[[step]]
card = { action = "snapshot" }
# trailing wait of 0 ticks is replaced by the next block's load wait
