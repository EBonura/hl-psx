# Shotgun: R1 three times (weapon 4, 8 shells, 24 in reserve).
name = "hl-weapons-shotgun"
title = "Half-Life: the shotgun fires one shell, or two from the double barrel"
disc = ["dist/hl-psx.cue"]
symbols = [".hlpsx/hl-psx.map"]
pad = "analog"
max_ticks = 30000

# Bound to the build these journeys were written against (hud::PREV_* are the HUD's
# last-drawn weapon, clip and reserve): tools/bind-weapon-addr.sh rewrites them from a link map.
[addr]
PREV_WEAPON = 0x800cdad4
PREV_CLIP = 0x800cdadc
PREV_RESERVE = 0x800cdad8
PREV_HEALTH = 0x800cdad0
LAST_CORE = 0x800ce5a0
[[step]]
label = "skip the studio splash, then the startup movie, if the disc has them (a disc without the movie ignores the second press)"
wait = 100

[[step]]
press = ["start"]
hold = 8
wait = 62

[[step]]
press = ["start"]
hold = 8
wait = 200

[[step]]
label = "boot through the splash to the main menu"
wait = 620

[[step]]
label = "open chapter select (fifth entry), then the chapter row"
press = ["down"]
hold = 8
wait = 12
repeat = 4

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
press = ["down"]
hold = 8
wait = 12
repeat = 13

[[step]]
press = ["cross"]
hold = 8
wait = 25

[[step]]
label = "enter the chapter's first map and wait for the live viewmodel"
press = ["cross"]
hold = 8
wait = 60

[[step]]
wait_until = { kind = "ram", sym = "VM_ENTRY", offset = 8, size = 1, op = "ne", value = 0 }
timeout = 9000

[[step]]
label = "settle: the first ticks of a map run the arrival"
wait = 400

[[step]]
label = "R1 steps to the next owned weapon"
press = ["r1"]
hold = 8
wait = 100
repeat = 3

[[step]]
label = "turn to face the wall"
rstick = [255, 128]
press = []
hold = 40
wait = 2

[[step]]
rstick = [128, 128]
press = []
wait = 20

[[step]]
label = "shotgun up"
checkpoint = "shotgun-ready"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_WEAPON"
size = 2
op = "eq"
value = 4
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "eq"
value = 8
[[step.assert]]
kind = "ram"
sym = "PREV_RESERVE"
size = 2
op = "eq"
value = 24
[[step.assert]]
kind = "not_flat"
[[step]]
label = "single blast"
press = ["r2"]
hold = 8
wait = 0

[[step]]
label = "wait until PREV_CLIP eq 7"
wait_until = { kind = "ram", sym = "PREV_CLIP", size = 2, op = "eq", value = 7 }
timeout = 300

[[step]]
label = "the sound asked for is core id 2"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 2 }
timeout = 300

[[step]]
label = "one shell"
checkpoint = "shotgun-single"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "eq"
value = 7
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "audio"
window = 60
min_peak = 500
[[step]]
label = "pump and settle"
wait = 130

[[step]]
label = "double barrel"
press = ["l2"]
hold = 30
wait = 0

[[step]]
label = "wait until PREV_CLIP eq 5"
wait_until = { kind = "ram", sym = "PREV_CLIP", size = 2, op = "eq", value = 5 }
timeout = 300

[[step]]
label = "the sound asked for is core id 51"
wait_until = { kind = "ram", sym = "LAST_CORE", size = 1, op = "eq", value = 51 }
timeout = 300

[[step]]
label = "two shells"
checkpoint = "shotgun-double"
golden = false
[[step.assert]]
kind = "ram"
sym = "PREV_CLIP"
size = 2
op = "eq"
value = 5
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "audio"
window = 60
min_peak = 500
