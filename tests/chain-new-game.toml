rstick = [128, 128]
press = []
hold_until = { kind="ram", sym="LOGIC_PLAYER_POS", size=4, signed=true, offset=0, op="le", value=590 }
timeout = 200
# trailing wait of 0 ticks is replaced by the next block's load wait

# ---- c1a1 -> c1a1a ----
[[step]]
label = "c1a1 loads"
wait_until = { kind = "ram", sym = "WORLD_ARENA", offset = 4, size = 4, op = "eq", value = 5551 }
timeout = 9000

[[step]]
label = "c1a1 first simulation tick"
wait_until = { kind = "ram", sym = "SIM_NOW", size = 2, op = "lt", value = 64 }
timeout = 9000

[[step]]
checkpoint = "arrive-c1a1"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "card_unchanged"
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_SUIT"
size=1
op="eq"
value=1
[[step.assert]]
kind="ram"
sym="LOGIC_PLAYER_HEALTH"
size=2
op="between"
value=1
value_hi=100
# trailing wait of 0 ticks is replaced by the next block's load wait
