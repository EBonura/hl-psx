# `trim-paths` is still a nightly cargo feature; the game is nightly-pinned
# anyway (bare-metal MIPS needs build-std), so the gate costs nothing.
cargo-features = ["trim-paths"]

# The PS1 game's workspace. Its root is the repository root, not game/, so
# every path dependency (the hydrated .psoxide crates, shared/hl-format) sits
# inside it. Cargo hashes a path package by its path relative to the workspace
# root when it can and by its absolute path otherwise, and that hash seeds
# every crate disambiguator, so with the root at game/ the image's symbols and
# layout changed with where the repository was checked out.
#
# The host tools are separate workspaces under host/ and shared/; the builder
# is run with `cargo hl-build ...` (.cargo/config.toml). The PS1 target config
# stays in game/.cargo/config.toml, so it only applies to builds run from
# game/, as the builder's are.
[workspace]
resolver = "2"
members  = ["game"]
# .psoxide is a generated tree with its own host workspace, and shared/ and
# host/ hold crates with their own [workspace]. Excluded crates are still
# hashed by their path relative to this root.
exclude  = [".psoxide", "shared", "host"]

[profile.release]
# no_std has no unwinder; abort keeps the binary small.
panic         = "abort"
codegen-units = 1
lto           = true
# Strip absolute host paths out of the binary. rustc bakes the source path of
# every panic/assert site into .rodata (core::panic::Location), the linker
# script folds .rodata into .data, and .data ends on ALIGN(2048) -- so where
# the checkout happens to sit changes how much PS1 RAM the program uses, in
# 2 KiB steps. Building from the demo disc submodule (a path 20 chars longer
# than the sibling checkout) crossed exactly one of those steps and the link
# failed with ".bss will not fit in region RAM". Trimming makes the output
# location-independent, and saves ~640 bytes of the paths themselves.
trim-paths    = "all"

# The card driver is one-shot code behind a menu action; size beats speed.
[profile.release.package.psx-mc]
opt-level = "s"
