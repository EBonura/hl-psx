[package]
name    = "hl-psx"
version = "0.1.0"
edition = "2021"

# Standalone workspace, deliberately NOT at the repo root: keeping the crate
# (and its device `.cargo/config.toml`) under game/ stops the PSX target config
# from leaking onto the host tools built from PSoXide (mkisopsx), and
# stops cargo adopting the SDK path-deps as implicit workspace members. Same
# layout as the proven oot-psx / pico8-psx games.
[workspace]

[[bin]]
name = "hl-psx"
path = "src/main.rs"

[profile.release]
# no_std has no unwinder; abort keeps the binary small.
panic         = "abort"
codegen-units = 1
lto           = true

[features]
default = []
# Emits PSoXide-only MMIO telemetry so `frontend launch` can stop on guest
# frames and write profile/counter CSVs. Keep it off for burn/shipping builds.
emulator-telemetry = []

# SDK crates from the sibling main PSoXide checkout. hl-psx intentionally rides
# the shared library so engine/SDK optimisations can be reused directly.
[dependencies]
psx-sdk  = { path = "../../PSoXide/sdk/crates/psx-sdk" }
psx-rt   = { path = "../../PSoXide/sdk/crates/psx-rt" }
psx-gpu  = { path = "../../PSoXide/sdk/crates/psx-gpu" }
psx-gte  = { path = "../../PSoXide/sdk/crates/psx-gte" }
psx-pad  = { path = "../../PSoXide/sdk/crates/psx-pad" }
psx-math = { path = "../../PSoXide/sdk/crates/psx-math" }
psx-vram = { path = "../../PSoXide/sdk/crates/psx-vram" }
psx-io   = { path = "../../PSoXide/sdk/crates/psx-io" }
psx-font = { path = "../../PSoXide/sdk/crates/psx-font" }
psx-telemetry = { path = "../../PSoXide/sdk/crates/psx-telemetry" }
