# Build this crate for the PlayStation 1 by default, so a plain
# `cargo build --release` produces a PSX-EXE.
[build]
target = "mipsel-sony-psx"
# Relative to game/, so the image stays at game/target/... now that the
# workspace root is the repository root.
target-dir = "target"

[unstable]
# No prebuilt std for the PSX target: compile core ourselves, with the
# memcpy/memset shims compiler-builtins needs on bare metal.
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

# The delay-slot filler flags (-disable-mips-df-*) come from the SDK's tools/sdk-examples.mk,
# added by the build driver (host/hl-build). A bare `cargo build` here does not carry them.

[env]
# The successor-block delay-slot search and the profiled layout leave 18 to 25 loads in delay
# slots, past the SDK default of 96 trampoline words.
PSX_HAZARD_TRAMPOLINE_WORDS = "256"
