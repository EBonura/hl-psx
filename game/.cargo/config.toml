# Build this crate for the PlayStation 1 by default, so a plain
# `cargo build --release` produces a PSX-EXE.
[build]
target = "mipsel-sony-psx"
# Relative to game/, so the image stays at game/target/... now that the
# workspace root is the repository root.
target-dir = "target"

[unstable]
# No prebuilt std for the PSX target: compile core ourselves, with the
# memcpy/memset shims compiler-builtins needs on bare metal.
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

[target.mipsel-sony-psx]
# LLVM's MIPS delay-slot filler only searches backwards by default, which left
# a nop behind 56% of the branches the chapter-two replay executed. Searching
# the successor block fills most of them (+2.3% rendered FPS, simulation state
# bit-identical at tape end); searching forward fills the slot after calls and
# takes 10.9 KB out of .text. The SDK's hazard_patch.py proves every link free
# of load-delay hazards. An exported RUSTFLAGS replaces this list, so a caller
# that sets one has to carry both flags itself.
rustflags = [
    "-Cllvm-args=-disable-mips-df-succbb-search=false",
    "-Cllvm-args=-disable-mips-df-forward-search=false",
]
