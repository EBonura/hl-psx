[package]
name = "hl-content"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust-only Half-Life to hl-psx content compiler"

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["tga"] }
psxed-audio = { git = "https://github.com/EBonura/PSoXide.git", rev = "897e90deba0d96105308a3aa114f0b9a6988a671" }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
zip = { version = "2", default-features = false }
