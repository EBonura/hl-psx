[package]
name = "hl-content"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Rust-only Half-Life to hl-psx content compiler"

[workspace]

[dependencies]
hl-format = { path = "../../shared/hl-format" }
image = { version = "0.25", default-features = false, features = ["tga"] }
psx-audio-cook = { path = "../../.psoxide/crates/psx-audio-cook" }
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
