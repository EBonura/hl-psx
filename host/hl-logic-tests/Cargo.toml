[package]
name = "hl-logic-tests"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Host runner for the PS1 crate's pure-logic unit tests"

[workspace]

[dependencies]
psx-goldsrc = { path = "../../.psoxide/engine/crates/psx-goldsrc" }
psx-asset = { path = "../../.psoxide/sdk/crates/psx-asset" }
psx-spu = { path = "../../.psoxide/sdk/crates/psx-spu" }
psx-sfx = { path = "../../.psoxide/sdk/crates/psx-sfx" }
psx-math = { path = "../../.psoxide/sdk/crates/psx-math" }
psx-engine = { path = "../../.psoxide/engine/crates/psx-engine" }
psx-gte = { path = "../../.psoxide/sdk/crates/psx-gte" }
psx-gpu = { path = "../../.psoxide/sdk/crates/psx-gpu" }
psx-pad = { path = "../../.psoxide/sdk/crates/psx-pad" }
hl-format = { path = "../../shared/hl-format" }
psx-vram = { path = "../../.psoxide/sdk/crates/psx-vram" }

[lib]
path = "src/lib.rs"

# The included game modules gate UI-only helpers on the game's own Cargo
# features; tell check-cfg about the ones they name.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("semantic-input", "deep-reference-trace"))'] }
